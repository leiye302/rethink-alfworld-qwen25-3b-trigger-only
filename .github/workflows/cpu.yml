name: CPU ablation contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      USE_TF: '0'
      USE_FLAX: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: src/sft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: configs/requirements-sft.txt
      - run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r configs/requirements-sft.txt
      - name: Prepare public source, frozen data and tokenizer only
        run: |
          python src/tools/setup.py --bundled-data --framework
          python -c "import json; from huggingface_hub import snapshot_download; c=json.load(open('configs/sft.json')); snapshot_download(c['base_model'], revision=c['base_revision'], local_dir=c['parent_dir'], allow_patterns=['*.json','*.txt','*.jinja'])"
      - name: CPU losses, resume, routing isolation, portability and recipe audit
        run: |
          python -m pytest src/sft/tests -q
          python -m unittest discover -s src/tools -p 'test_*.py' -v
          python src/tools/audit_recipe.py --framework
          if python -c "import json,sys; sys.exit(not json.load(open('configs/ablation.json'))['sft_enabled'])"; then
            python -m route_bce.preflight --data data/route_sft --tokenizer checkpoints/Qwen2.5-3B-Instruct --supervision-mode trigger_only --output reports/token_audit.json
          fi
          python src/tools/check.py
          python src/tools/package.py
          bash -n scripts/train.sh scripts/eval.sh scripts/reproduce.sh
